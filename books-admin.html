<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الكتب — Admin</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main style="padding:3rem 0">
    <div class="container" style="max-width:1100px">
      <h1>إدارة الكتب</h1>
      <p class="page-sub">عدّل أو أضف أو احذف كتبًا → اضغط <strong>حفظ على GitHub</strong> → ثم اطلب من ديفين "rebuild" ليولّد الصفحات ويحدّث sitemap تلقائيًا.</p>

      <div class="admin-layout">
      <aside class="admin-side">
        <div class="search-box">
          <input type="search" id="q" placeholder="ابحث في الكتب…">
        </div>
        <div class="chips" style="margin:.8rem 0">
          <button class="chip active" data-l="ar">عربي</button>
          <button class="chip" data-l="en">English</button>
        </div>
        <ul id="list" class="book-list"></ul>
      </aside>

      <div class="admin-form">
        <div class="row2">
          <label>اللغة
            <select id="fLang"><option value="ar">عربي</option><option value="en">English</option></select></label>
          <label>القسم
            <select id="fSec">
              <option value="lit">روايات وأدب</option><option value="heritage">تراث وكلاسيكيات</option>
              <option value="self">تنمية وفكر</option><option value="classic">Classics</option>
              <option value="modern">Modern</option>
            </select></label>
        </div>
        <label>اسم الكتاب <input id="fTitle"></label>
        <label>المؤلف <input id="fAuthor"></label>
        <label>ملخص <textarea id="fSum" rows="3"></textarea></label>
        <div class="row2">
          <label>رابط التحميل المباشر <input id="fLink" dir="ltr" placeholder="https://…"></label>
          <label>رابط الصورة <input id="fImg" dir="ltr" placeholder="اتركه فارغًا للبحث التلقائي"></label>
        </div>
        <div class="admin-actions">
          <button class="btn primary" id="addBtn">＋ أضف / احفظ التعديل</button>
          <button class="btn yt" id="saveBtn">💾 حفظ على GitHub</button>
          <button class="btn" id="clearBtn">نموذج جديد</button>
        </div>
        <p id="status" style="color:var(--accent-2);font-weight:700"></p>
      </div>
      </div>
    </div>
  </main>

  <script src="assets/js/books_data.js"></script>
  <script>
  (function () {
    var REPO = "ashrafedes/m3lomat-momt3a", FILE = "assets/js/books_data.js";
    var viewLang = "ar", editIdx = -1;

    function cur() { return viewLang === "ar" ? BOOKS_AR : BOOKS_EN; }
    function status(msg, ok) {
      var s = document.getElementById("status");
      s.textContent = msg; s.style.color = ok ? "var(--accent-2)" : "#e11d48";
    }

    function render() {
      var q = document.getElementById("q").value.trim().toLowerCase();
      var html = "";
      cur().forEach(function (b, i) {
        if (q && (b.dt + " " + (b.au || "")).toLowerCase().indexOf(q) < 0) return;
        html += '<li class="book-row"><span><strong>' + (b.dt||"") + '</strong>' +
                '<small>' + (b.au||"") + " — " + b.sec + '</small></span>' +
                '<span class="row-btns"><button class="chip" data-e="' + i + '">تعديل</button>' +
                '<button class="chip" data-d="' + i + '">حذف</button></span></li>';
      });
      document.getElementById("list").innerHTML = html;
    }

    document.getElementById("q").oninput = render;
    document.querySelectorAll(".chip[data-l]").forEach(function (c) {
      c.onclick = function () {
        document.querySelectorAll(".chip[data-l]").forEach(function (x) { x.classList.remove("active"); });
        c.classList.add("active"); viewLang = c.dataset.l; editIdx = -1; render();
      };
    });

    document.getElementById("list").onclick = function (ev) {
      var e = ev.target.dataset.e, d = ev.target.dataset.d;
      if (e !== undefined) {
        var b = cur()[e];
        fLang.value = viewLang; fSec.value = b.sec; fTitle.value = b.dt || "";
        fAuthor.value = b.au || ""; fSum.value = b.sm || "";
        fLink.value = b.link || ""; fImg.value = b.img || "";
        editIdx = +e; status("وضع التعديل: " + b.dt, true);
      } else if (d !== undefined && confirm("حذف «" + cur()[d].dt + "»؟")) {
        cur().splice(+d, 1); render(); status("حُذف — اضغط حفظ على GitHub", true);
      }
    };

    document.getElementById("addBtn").onclick = function () {
      var b = {
        sec: fSec.value, qt: fTitle.value.trim(), dt: fTitle.value.trim(),
        au: fAuthor.value.trim(), sm: fSum.value.trim(),
        kind: "direct", link: fLink.value.trim(), img: fImg.value.trim()
      };
      if (!b.dt || !b.link) { status("العنوان ورابط التحميل مطلوبان"); return; }
      var list = (fLang.value === "ar") ? BOOKS_AR : BOOKS_EN;
      if (editIdx >= 0 && list === cur()) list[editIdx] = b; else list.push(b);
      editIdx = -1; render(); status("تم — اضغط حفظ على GitHub لنشره", true);
    };
    document.getElementById("clearBtn").onclick = function () {
      editIdx = -1;
      ["fTitle","fAuthor","fSum","fLink","fImg"].forEach(function (id){document.getElementById(id).value="";});
    };

    document.getElementById("saveBtn").onclick = function () {
      var token = localStorage.getItem("gh_pat");
      if (!token) {
        token = prompt("GitHub Personal Access Token (مرة واحدة فقط):");
        if (!token) return;
        localStorage.setItem("gh_pat", token);
      }
      var content = "const BOOKS_AR=" + JSON.stringify(BOOKS_AR) + ";\n" +
                    "const BOOKS_EN=" + JSON.stringify(BOOKS_EN) + ";\n";
      status("جارٍ الحفظ…", true);
      fetch("https://api.github.com/repos/" + REPO + "/contents/" + FILE, {
        headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" }
      }).then(function (r) { return r.json(); }).then(function (meta) {
        return fetch("https://api.github.com/repos/" + REPO + "/contents/" + FILE, {
          method: "PUT",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({
            message: "Update books via admin", sha: meta.sha,
            content: btoa(unescape(encodeURIComponent(content)))
          })
        });
      }).then(function (r) {
        if (r.ok) status("✅ تم الحفظ على GitHub — قل لديفين: rebuild", true);
        else r.json().then(function (e) { status("خطأ: " + (e.message || r.status)); });
      }).catch(function (e) { status("خطأ: " + e.message); });
    };
    render();
  })();
  </script>
  <style>
    .admin-layout { display: grid; grid-template-columns: 330px 1fr; gap: 1.4rem; align-items: start; margin-top: 1.4rem; }
    .admin-side {
      position: sticky; top: 80px;
      max-height: calc(100vh - 110px); overflow-y: auto;
      background: var(--bg-soft); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 1rem;
    }
    .admin-side .search-box { padding: .5rem .8rem; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .admin-actions { display: flex; gap: .6rem; flex-wrap: wrap; }
    .book-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
    .book-row { display: flex; justify-content: space-between; align-items: center; gap: .7rem;
      background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: .55rem .8rem; }
    .book-row small { display: block; color: var(--muted); }
    .row-btns { display: flex; gap: .4rem; flex-shrink: 0; }
    @media (max-width: 860px) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-side { position: static; max-height: 45vh; }
    }
  </style>
</body>
</html>
